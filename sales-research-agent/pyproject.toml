[project]
name = "sales-research-agent"
version = "1.0.0"
description = "A sales research agent built from scratch with the OpenAI SDK (no agent frameworks)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
sales-agent = "sales_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
